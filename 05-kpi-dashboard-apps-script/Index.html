<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #111827; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; }
    .label { font-size: 12px; color: #6b7280; } .value { font-size: 26px; font-weight: 600; }
    .bar { height: 14px; background: #6366f1; border-radius: 4px; }
    #status { color: #6b7280; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Support KPI Dashboard</h1>
  <label>Window
    <select id="days"><option>7</option><option selected>30</option><option>90</option></select> days
  </label>
  <button id="refresh">Refresh</button>
  <div id="status">Loading…</div>
  <div class="grid" id="cards"></div>
  <h3>Open backlog by age</h3><div id="aging"></div>

  <script>
    const $ = id => document.getElementById(id);
    const pct = r => r == null ? '—' : Math.round(r * 100) + '%';
    const hrs = h => h == null ? '—' : h.toFixed(1) + ' h';
    function render(s) {
      const cards = [['New (7d)', s.created7], ['Closed', s.completed30], ['Open now', s.openNow],
        ['First-response SLA', pct(s.firstResponseSlaRate)], ['Median first response', hrs(s.medianFirstResponseHours)],
        ['Median resolution', hrs(s.medianResolutionHours)], ['Complete on arrival', pct(s.intakeCompleteRate)],
        ['Repeat issues', pct(s.repeatRate)], ['Escalated', pct(s.escalationRate)]];
      $('cards').innerHTML = cards.map(([l, v]) => `<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
      const max = Math.max(1, ...Object.values(s.aging));
      $('aging').innerHTML = Object.entries(s.aging).map(([k, v]) =>
        `<div>${k} (${v})<div class="bar" style="width:${(v / max) * 100}%"></div></div>`).join('');
      $('status').textContent = 'Updated ' + new Date(s.generatedAt).toLocaleString();
    }
    function load() {
      $('status').textContent = 'Loading…';
      google.script.run.withSuccessHandler(render)
        .withFailureHandler(e => $('status').textContent = 'Could not load: ' + e.message)
        .getDashboardSnapshot({ days: $('days').value });
    }
    $('refresh').onclick = load; $('days').onchange = load; load();
  </script>
</body>
</html>
